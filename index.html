<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>와토 모음</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top,#1e3a8a 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f172a 0%,transparent 35%),
        #020617;
      color:#fff;
      font-family:Malgun Gothic,Arial,sans-serif;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:18px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      padding:26px 22px;
      border-radius:24px;
      background:linear-gradient(135deg,#111827,#1e293b 55%,#1d4ed8);
      border:1px solid rgba(255,255,255,.12);
      margin-bottom:16px;
      box-shadow:0 10px 40px rgba(0,0,0,.45);
    }

    .hero::before{
      content:"";
      position:absolute;
      top:-80px;
      right:-80px;
      width:220px;
      height:220px;
      border-radius:50%;
      background:rgba(255,255,255,.06);
    }

    .title{
      position:relative;
      font-size:34px;
      font-weight:900;
      text-align:center;
      letter-spacing:-1px;
    }

    .sub{
      position:relative;
      text-align:center;
      color:#cbd5e1;
      margin-top:10px;
      font-size:14px;
    }

    .tabs{
      display:grid;
      gap:10px;
      margin-bottom:14px;
    }

    .board-tabs{
      grid-template-columns:repeat(3,1fr);
    }

</html>

name: Update Mitto Watos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Scrape watos
        run: npm run scrape

        - name: Pull latest changes
        run: |
          git config pull.rebase true
          git pull origin main --rebase

      - name: Commit updated watos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update mitto watos
          file_pattern: public/data/watos.json

name: Update Mitto Watos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-mitto-watos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Scrape watos
        run: npm run scrape

      - name: Preserve generated JSON
        run: |
          cp data/watos.json /tmp/watos.json

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Restore generated JSON
        run: |
          mkdir -p data
          cp /tmp/watos.json data/watos.json

      - name: Commit updated watos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update mitto watos
          file_pattern: data/watos.json
